<!-- ClientJS.html — Lógica de cliente: runGas, sesión/permisos, navegación SPA, toasts, modales, operación de caseta y lector QR -->
<script>
'use strict';

/* =====================================================================
 * Estado global y constantes
 * ===================================================================== */
const STATE = {
  session: null,       // { correo, nombre, rol, caseta, permisos[] }
  casetas: [],         // casetas activas
  casetaId: '',        // caseta activa del operador
  currentView: null,
  dentro: [],          // resultado completo de vehiculosDentro()
  dentroLoaded: false
};

const VIEW_PERMS = { operacion: 'operacion', consultas: 'consulta', reportes: 'reportes', catalogos: 'catalogo.leer' };
const VIEW_TITLES = { operacion: 'Operación de Caseta', consultas: 'Consultas', reportes: 'Reportes', catalogos: 'Catálogos' };
const VIEW_ORDER = ['operacion', 'consultas', 'reportes', 'catalogos'];
const VIEW_HOOKS = {};          // vista -> { onShow, onHide }
const MODAL_CLOSE_HOOKS = {};   // id de modal -> función al cerrar
const REGEX_PLACA = /^[A-Z0-9]{5,8}$/;
const STORAGE_KEY_CASETA = 'cvuat.casetaId';
const DENTRO_REFRESH_MS = 60000;

/* =====================================================================
 * Utilidades
 * ===================================================================== */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

function escapeHtml(v) {
  return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function normalizarPlaca(v) {
  return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function debounce(fn, ms) {
  let t = null;
  const wrapped = function () {
    const args = arguments;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(null, args), ms);
  };
  wrapped.cancel = () => clearTimeout(t);
  return wrapped;
}

function refreshIcons() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
}

function hasPerm(p) {
  return !!(STATE.session && STATE.session.permisos.indexOf(p) !== -1);
}

function esActivo(v) {
  return !(v === false || String(v).toUpperCase() === 'FALSE');
}

/** "2026-11-20T08:14:05" -> "08:14" */
function horaDe(iso) {
  return iso && String(iso).length >= 16 ? String(iso).substring(11, 16) : '--:--';
}

/** "2026-11-20T08:14:05" -> "20/11 08:14" */
function fechaHoraCorta(iso) {
  const s = String(iso || '');
  if (s.length < 16) return '--';
  return s.substring(8, 10) + '/' + s.substring(5, 7) + ' ' + s.substring(11, 16);
}

/** "2026-11-20T08:14:05" -> "20/11/2026 08:14:05" */
function fechaHoraLegible(iso) {
  const s = String(iso || '');
  if (s.length < 16) return '--';
  const hora = s.length >= 19 ? s.substring(11, 19) : s.substring(11, 16);
  return s.substring(8, 10) + '/' + s.substring(5, 7) + '/' + s.substring(0, 4) + ' ' + hora;
}

/** Devuelve badge HTML para estados de movimiento: DENTRO, SALIO, SIN SALIDA. */
function badgeEstadoHtml(estado) {
  if (estado === 'DENTRO') return '<span class="badge badge-dentro">DENTRO</span>';
  if (estado === 'SALIO') return '<span class="badge badge-salio">SALIO</span>';
  if (estado === 'SIN SALIDA') return '<span class="badge badge-sin-salida">SIN SALIDA</span>';
  return '<span class="badge badge-info">' + escapeHtml(estado || '—') + '</span>';
}

/** Convierte una cadena base64 en Blob sin exceder pila de argumentos. */
function base64ToBlob(base64, mimeType) {
  const limpio = String(base64 || '').replace(/\s+/g, '');
  const bytes = atob(limpio);
  const partes = [];
  const paso = 8192;
  for (let offset = 0; offset < bytes.length; offset += paso) {
    const slice = bytes.slice(offset, offset + paso);
    const arr = new Uint8Array(slice.length);
    for (let i = 0; i < slice.length; i++) arr[i] = slice.charCodeAt(i);
    partes.push(arr);
  }
  return new Blob(partes, { type: mimeType || 'application/octet-stream' });
}

/** Descarga un archivo retornado por exportarMovimientos(): { nombre, mime, base64 }. */
function descargarArchivoBase64(res) {
  if (!res || !res.base64) throw new Error('El servidor no devolvió el contenido del archivo.');
  const blob = base64ToBlob(res.base64, res.mime);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = res.nombre || 'Movimientos_CUTM_Sur';
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    if (a.parentNode) a.parentNode.removeChild(a);
    URL.revokeObjectURL(url);
  }, 15000);
}

/** 3.25 -> "3 h 15 min" */
function formatHoras(h) {
  const total = Math.max(0, Math.round(Number(h || 0) * 60));
  const hh = Math.floor(total / 60);
  const mm = total % 60;
  return hh ? hh + ' h ' + String(mm).padStart(2, '0') + ' min' : mm + ' min';
}

function horaActual() {
  return new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

function iniciales(nombre) {
  const partes = String(nombre || '').trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return '--';
  return (partes[0][0] + (partes.length > 1 ? partes[partes.length - 1][0] : '')).toUpperCase();
}

function storageGet(k) {
  try { return window.localStorage.getItem(k); } catch (e) { return null; }
}

function storageSet(k, v) {
  try { window.localStorage.setItem(k, v); } catch (e) { /* almacenamiento no disponible en el iframe */ }
}

function valorCampo(id) {
  const el = document.getElementById(id);
  return el ? String(el.value || '').trim() : '';
}

function esEscritorio() {
  return window.matchMedia('(min-width: 1024px)').matches;
}

/* =====================================================================
 * runGas: Promesa sobre google.script.run con manejo de {ok, data, error}
 * ===================================================================== */
class GasError extends Error {
  constructor(message, fromBackend) {
    super(message);
    this.name = 'GasError';
    this.fromBackend = !!fromBackend;
  }
}

function runGas(fnName) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) {
      reject(new GasError('El entorno de Google Apps Script no está disponible. Abra el sistema desde su URL de implementación.', false));
      return;
    }
    const runner = google.script.run
      .withSuccessHandler(res => {
        if (res && typeof res === 'object' && Object.prototype.hasOwnProperty.call(res, 'ok')) {
          if (res.ok) resolve(res.data);
          else reject(new GasError(res.error || 'Error desconocido del servidor.', true));
        } else {
          resolve(res);
        }
      })
      .withFailureHandler(err => {
        const msg = err && err.message ? err.message : String(err || 'Error de comunicación con el servidor.');
        reject(new GasError('Error de comunicación: ' + msg, false));
      });
    if (typeof runner[fnName] !== 'function') {
      reject(new GasError('Función de servidor no disponible: ' + fnName, false));
      return;
    }
    runner[fnName].apply(runner, args);
  });
}

/** Ejecuta una tarea asíncrona bloqueando el botón (evita dobles clics). */
async function withBusy(btn, busyLabel, task) {
  if (!btn) return task();
  if (btn.getAttribute('aria-busy') === 'true') return undefined;
  const original = btn.innerHTML;
  const wasDisabled = btn.disabled;
  btn.setAttribute('aria-busy', 'true');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span><span>' + escapeHtml(busyLabel) + '</span>';
  try {
    return await task();
  } finally {
    btn.innerHTML = original;
    btn.removeAttribute('aria-busy');
    btn.disabled = wasDisabled;
    refreshIcons();
  }
}

/* =====================================================================
 * Toasts
 * ===================================================================== */
const TOAST_ICONS = { success: 'circle-check', error: 'circle-x', warning: 'triangle-alert', info: 'info' };
const TOAST_MAX = 4;

function showToast(message, type, ms) {
  const kind = TOAST_ICONS[type] ? type : 'info';
  const container = document.getElementById('toast-container');
  if (!container) return;
  const el = document.createElement('div');
  el.className = 'toast toast-' + kind;
  el.setAttribute('role', kind === 'error' ? 'alert' : 'status');
  el.innerHTML =
    '<i data-lucide="' + TOAST_ICONS[kind] + '" class="toast-icon w-5 h-5 mt-0.5"></i>' +
    '<div class="flex-1 min-w-0 break-words">' + escapeHtml(message) + '</div>' +
    '<button type="button" class="text-ink-muted hover:text-ink w-6 h-6 flex items-center justify-center" aria-label="Cerrar notificación">' +
    '<i data-lucide="x" class="w-4 h-4"></i></button>';
  container.appendChild(el);
  while (container.children.length > TOAST_MAX) container.removeChild(container.firstChild);
  refreshIcons();
  const close = () => {
    if (el.classList.contains('leaving')) return;
    el.classList.add('leaving');
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 180);
  };
  el.querySelector('button').addEventListener('click', close);
  setTimeout(close, ms || (kind === 'error' ? 7000 : 4000));
}

/* =====================================================================
 * Modales
 * ===================================================================== */
function openModal(id) {
  const m = document.getElementById(id);
  if (!m) return;
  m.hidden = false;
  document.body.classList.add('modal-open');
  refreshIcons();
}

function closeModal(id) {
  const m = document.getElementById(id);
  if (!m || m.hidden) return;
  m.hidden = true;
  if (!$$('.modal').some(x => !x.hidden)) document.body.classList.remove('modal-open');
  if (MODAL_CLOSE_HOOKS[id]) MODAL_CLOSE_HOOKS[id]();
}

function bindModales() {
  document.addEventListener('click', e => {
    const closer = e.target.closest('[data-close-modal]');
    if (closer) { closeModal(closer.getAttribute('data-close-modal')); return; }
    if (e.target.classList && e.target.classList.contains('modal')) closeModal(e.target.id);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const abiertos = $$('.modal').filter(x => !x.hidden);
    if (abiertos.length) closeModal(abiertos[abiertos.length - 1].id);
  });
}

/* =====================================================================
 * Pantallas, sesión y permisos
 * ===================================================================== */
function showScreen(name) {
  $('#screen-loading').hidden = name !== 'loading';
  $('#screen-denied').hidden = name !== 'denied';
  $('#app-shell').hidden = name !== 'app';
  refreshIcons();
}

function mostrarAccesoDenegado(err) {
  const backend = !!(err && err.fromBackend);
  $('#denied-title').textContent = backend ? 'Acceso Denegado' : 'No se pudo verificar la sesión';
  $('#denied-message').textContent = (err && err.message) || 'No fue posible validar su cuenta institucional.';
  showScreen('denied');
}

async function iniciarSesion() {
  showScreen('loading');
  let sesion;
  try {
    sesion = await runGas('login');
  } catch (e) {
    mostrarAccesoDenegado(e);
    return;
  }
  sesion = sesion || {};
  sesion.permisos = Array.isArray(sesion.permisos) ? sesion.permisos : [];
  STATE.session = sesion;

  const permitidas = VIEW_ORDER.filter(v => hasPerm(VIEW_PERMS[v]));
  if (!permitidas.length) {
    mostrarAccesoDenegado(new GasError('Su rol (' + (sesion.rol || 'sin rol') + ') no tiene módulos habilitados. Contacte al administrador.', true));
    return;
  }

  renderSesion();
  aplicarPermisos();
  showScreen('app');
  navigate(permitidas[0]);
  cargarCasetas();
}

function renderSesion() {
  const s = STATE.session;
  $$('[data-session="nombre"]').forEach(el => { el.textContent = s.nombre || s.correo || ''; });
  $$('[data-session="rol"]').forEach(el => { el.textContent = s.rol || ''; });
  $$('[data-session="correo"]').forEach(el => { el.textContent = s.correo || ''; });
  $$('[data-session="iniciales"]').forEach(el => { el.textContent = iniciales(s.nombre || s.correo); el.title = (s.nombre || '') + ' · ' + (s.rol || ''); });
}

/** Muestra/oculta pestañas y secciones leyendo estrictamente session.permisos. */
function aplicarPermisos() {
  $$('[data-perm]').forEach(el => { el.hidden = !hasPerm(el.getAttribute('data-perm')); });
  const visibles = $$('#nav-mobile-grid [data-nav]').filter(el => !el.hidden).length;
  $('#nav-mobile-grid').style.gridTemplateColumns = 'repeat(' + Math.max(1, visibles) + ', minmax(0, 1fr))';
  $$('[data-view]').forEach(sec => {
    const perm = VIEW_PERMS[sec.getAttribute('data-view')];
    if (!perm || !hasPerm(perm)) sec.hidden = true;
  });
}

/* =====================================================================
 * Navegación SPA
 * ===================================================================== */
function navigate(view) {
  const perm = VIEW_PERMS[view];
  if (!perm || !hasPerm(perm)) {
    showToast('No tiene permiso para acceder a este módulo.', 'warning');
    return;
  }
  if (STATE.currentView === view) return;
  const prev = STATE.currentView;
  if (prev && VIEW_HOOKS[prev] && VIEW_HOOKS[prev].onHide) VIEW_HOOKS[prev].onHide();

  $$('[data-view]').forEach(sec => { sec.hidden = sec.getAttribute('data-view') !== view; });
  $$('[data-nav]').forEach(btn => {
    if (btn.getAttribute('data-nav') === view) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });
  $('#page-title').textContent = VIEW_TITLES[view] || '';
  STATE.currentView = view;
  window.scrollTo(0, 0);
  if (VIEW_HOOKS[view] && VIEW_HOOKS[view].onShow) VIEW_HOOKS[view].onShow();
  refreshIcons();
}

function bindNavegacion() {
  $$('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => navigate(btn.getAttribute('data-nav')));
  });
  $('#btn-retry-login').addEventListener('click', iniciarSesion);
}

/* =====================================================================
 * Casetas
 * ===================================================================== */
async function cargarCasetas() {
  try {
    const data = await runGas('listarCasetasActivas');
    STATE.casetas = Array.isArray(data) ? data : [];
  } catch (e) {
    STATE.casetas = [];
    showToast('No se pudieron cargar las casetas: ' + e.message, 'error');
  }
  renderCasetaSelects();
  setCaseta(resolverCasetaInicial(), { silent: true });
  if (typeof CAT !== 'undefined' && CAT.usuariosLoaded) renderUsuariosTabla();
}

function buscarCaseta(valor) {
  const v = String(valor || '').trim().toLowerCase();
  if (!v) return null;
  return STATE.casetas.find(c => String(c.ID).toLowerCase() === v || String(c.Nombre).toLowerCase() === v) || null;
}

/** Prioridad: caseta asignada en la sesión -> última usada en el dispositivo -> única caseta disponible. */
function resolverCasetaInicial() {
  const asignada = buscarCaseta(STATE.session && STATE.session.caseta);
  if (asignada) return asignada.ID;
  const guardada = buscarCaseta(storageGet(STORAGE_KEY_CASETA));
  if (guardada) return guardada.ID;
  return STATE.casetas.length === 1 ? STATE.casetas[0].ID : '';
}

function casetaNombre(id) {
  const c = STATE.casetas.find(x => String(x.ID) === String(id));
  return c ? c.Nombre : '';
}

function renderCasetaSelects() {
  const opciones = STATE.casetas.map(c =>
    '<option value="' + escapeHtml(c.ID) + '">' + escapeHtml(c.Nombre) + '</option>').join('');
  $$('select[data-caseta-select]').forEach(sel => {
    sel.innerHTML = '<option value="">' + (STATE.casetas.length ? 'Seleccione caseta…' : 'Sin casetas activas') + '</option>' + opciones;
    sel.disabled = !STATE.casetas.length;
    sel.value = STATE.casetaId;
  });
  $$('select[data-caseta-filter]').forEach(sel => {
    const actual = sel.value;
    sel.innerHTML = '<option value="">Todas las casetas</option>' + opciones;
    sel.value = STATE.casetas.some(c => String(c.ID) === actual) ? actual : '';
  });
}

function setCaseta(id, opts) {
  const c = buscarCaseta(id);
  STATE.casetaId = c ? c.ID : '';
  $$('select[data-caseta-select]').forEach(sel => { sel.value = STATE.casetaId; });
  if (STATE.casetaId) storageSet(STORAGE_KEY_CASETA, STATE.casetaId);
  document.dispatchEvent(new CustomEvent('caseta:change', { detail: { casetaId: STATE.casetaId } }));
  if (!(opts && opts.silent) && c) showToast('Caseta activa: ' + c.Nombre, 'info', 2500);
}

function bindCasetaSelects() {
  $$('select[data-caseta-select]').forEach(sel => {
    sel.addEventListener('change', () => setCaseta(sel.value));
  });
}

/* =====================================================================
 * Vista Operación
 * ===================================================================== */
const OP = {
  placa: '',
  vehiculo: null,        // vehículo exacto encontrado en catálogo
  resultados: [],        // autocompletado
  acIndex: -1,
  lookupSeq: 0,
  lookupDone: false,
  lookupError: '',
  submitting: false,
  catalogoGuardadoPara: '',  // placa cuyo visitante ya se guardó en catálogo (evita duplicados al reintentar)
  salidasPendientes: {},     // movimientoId -> true mientras se registra su salida (evita dobles clics)
  dentroLoading: false,
  dentroError: '',
  refreshTimer: null,
  scanner: null,
  qrProcesando: false
};

const buscarPlacaDebounced = debounce(() => consultarPlaca(), 250);

function initOperacion() {
  const input = $('#placa-input');

  input.addEventListener('input', () => {
    const limpia = normalizarPlaca(input.value).slice(0, 8);
    if (input.value !== limpia) input.value = limpia;
    cambiarPlaca(limpia);
    buscarPlacaDebounced();
  });
  input.addEventListener('keydown', onPlacaKeydown);
  input.addEventListener('focus', renderAutocomplete);
  input.addEventListener('blur', () => setTimeout(cerrarAutocomplete, 150));

  $('#btn-placa-clear').addEventListener('click', () => { limpiarFormularioEntrada(); });
  $('#btn-scan-qr').addEventListener('click', abrirLectorQR);
  $('#btn-registrar-entrada').addEventListener('click', registrarEntrada);
  $('#btn-cierre-turno').addEventListener('click', abrirCierreTurno);
  $('#btn-cierre-confirmar').addEventListener('click', confirmarCierreTurno);
  $('#btn-dentro-refresh').addEventListener('click', () => cargarDentro(false));
  $('#dentro-search').addEventListener('input', renderDentro);
  $('#dentro-filter').addEventListener('change', renderDentro);

  $('#ac-list').addEventListener('mousedown', e => {
    const item = e.target.closest('[data-ac-index]');
    if (!item) return;
    e.preventDefault();
    seleccionarResultado(Number(item.getAttribute('data-ac-index')));
  });

  $('#dentro-list').addEventListener('click', e => {
    const btn = e.target.closest('[data-action="salida"]');
    if (btn) registrarSalida(btn.getAttribute('data-id'), btn);
    const retry = e.target.closest('[data-action="reintentar-dentro"]');
    if (retry) cargarDentro(false);
  });

  $('#btn-ya-dentro-salida').addEventListener('click', async e => {
    const btn = e.currentTarget;
    const ok = await registrarSalida(btn.getAttribute('data-id'), btn);
    if (ok) limpiarFormularioEntrada();
  });

  ['vis-nombre', 'vis-identificacion', 'vis-telefono', 'vis-motivo', 'vis-marca', 'vis-modelo', 'vis-color'].forEach(id => {
    $('#' + id).addEventListener('input', updateEntradaButton);
  });
  $('#vis-tipo').addEventListener('change', actualizarFormVisitante);
  $('#vis-catalogo').addEventListener('change', actualizarFormVisitante);
  $('#vis-vehiculo').addEventListener('change', actualizarFormVisitante);
  $('#entrada-obs').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); registrarEntrada(); }
  });

  $('#qr-file-input').addEventListener('change', leerQRDesdeArchivo);
  $('#qr-file-gallery').addEventListener('change', leerQRDesdeArchivo);
  $('#btn-qr-retry').addEventListener('click', iniciarCamaraQR);
  MODAL_CLOSE_HOOKS['modal-qr'] = detenerCamaraQR;

  document.addEventListener('caseta:change', () => {
    renderEstadoCaseta();
    updateEntradaButton();
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && STATE.currentView === 'operacion' && STATE.dentroLoaded) cargarDentro(true);
  });

  VIEW_HOOKS.operacion = {
    onShow: () => {
      renderEstadoCaseta();
      renderVehiculo();
      cargarDentro(STATE.dentroLoaded);
      clearInterval(OP.refreshTimer);
      OP.refreshTimer = setInterval(() => { if (!document.hidden) cargarDentro(true); }, DENTRO_REFRESH_MS);
      if (esEscritorio()) setTimeout(() => $('#placa-input').focus(), 50);
    },
    onHide: () => {
      clearInterval(OP.refreshTimer);
      OP.refreshTimer = null;
    }
  };

  renderEstadoCaseta();
  renderVehiculo();
}

function renderEstadoCaseta() {
  const el = $('#op-caseta-status');
  if (!el) return;
  if (STATE.casetaId) {
    el.className = 'mt-1.5 text-xs font-semibold flex items-center gap-1.5 text-ok';
    el.innerHTML = '<i data-lucide="map-pin" class="w-3.5 h-3.5"></i>Operando en ' + escapeHtml(casetaNombre(STATE.casetaId));
  } else {
    el.className = 'mt-1.5 text-xs font-semibold flex items-center gap-1.5 text-warn';
    el.innerHTML = '<i data-lucide="triangle-alert" class="w-3.5 h-3.5"></i>Seleccione la caseta desde la que opera para registrar movimientos.';
  }
  refreshIcons();
}

/* ---------- Placa y autocompletado ---------- */
function cambiarPlaca(placa) {
  OP.placa = placa;
  OP.vehiculo = null;
  OP.lookupDone = false;
  OP.lookupError = '';
  OP.acIndex = -1;
  if (placa.length < 2) { OP.resultados = []; OP.lookupSeq++; }
  renderAutocomplete();
  renderVehiculo();
}

async function consultarPlaca(opts) {
  const p = OP.placa;
  if (p.length < 2) return;
  const seq = ++OP.lookupSeq;
  try {
    const data = await runGas('buscarVehiculoPorPlaca', p);
    if (seq !== OP.lookupSeq || p !== OP.placa) return;
    OP.resultados = Array.isArray(data) ? data : [];
    const exactIdx = OP.resultados.findIndex(v => normalizarPlaca(v.Placa) === p);
    OP.vehiculo = exactIdx !== -1 ? OP.resultados[exactIdx] : null;
    OP.lookupError = '';
    if (opts && opts.seleccionarExacto && exactIdx !== -1) {
      seleccionarResultado(exactIdx);
      return;
    }
  } catch (e) {
    if (seq !== OP.lookupSeq || p !== OP.placa) return;
    OP.resultados = [];
    OP.vehiculo = null;
    OP.lookupError = 'No se pudo consultar el catálogo: ' + e.message;
  }
  OP.lookupDone = true;
  OP.acIndex = -1;
  renderAutocomplete();
  renderVehiculo();
}

/** Asigna una placa directamente (QR o selección) y consulta de inmediato. */
function aplicarPlaca(placa) {
  const p = normalizarPlaca(placa).slice(0, 8);
  $('#placa-input').value = p;
  buscarPlacaDebounced.cancel();
  cambiarPlaca(p);
  cerrarAutocomplete();
  consultarPlaca();
}

function seleccionarResultado(i) {
  const v = OP.resultados[i];
  if (!v) return;
  const p = normalizarPlaca(v.Placa);
  buscarPlacaDebounced.cancel();
  OP.lookupSeq++;
  $('#placa-input').value = p;
  OP.placa = p;
  OP.vehiculo = v;
  OP.resultados = [v];
  OP.lookupDone = true;
  OP.lookupError = '';
  cerrarAutocomplete();
  renderVehiculo();
}

function autocompleteVisible() {
  const r = OP.resultados;
  if (!r.length || document.activeElement !== $('#placa-input')) return false;
  return !(r.length === 1 && normalizarPlaca(r[0].Placa) === OP.placa);
}

function renderAutocomplete() {
  const list = $('#ac-list');
  const input = $('#placa-input');
  if (!autocompleteVisible()) { cerrarAutocomplete(); return; }
  list.innerHTML = OP.resultados.map((v, i) => {
    const desc = [v.Marca, v.Modelo, v.Color].filter(Boolean).join(' · ') || 'Sin datos del vehículo';
    const inactivo = !esActivo(v.Activo);
    return '<button type="button" class="ac-item" role="option" data-ac-index="' + i + '" aria-selected="' + (i === OP.acIndex) + '">' +
      '<span class="plate">' + escapeHtml(v.Placa) + '</span>' +
      '<span class="min-w-0 flex-1"><span class="block text-sm font-semibold text-ink truncate">' + escapeHtml(desc) + '</span>' +
      '<span class="block text-xs text-ink-muted truncate">' + escapeHtml(v.TitularNombre || 'Sin titular') + ' · ' + escapeHtml(v.TipoTitular || '') + '</span></span>' +
      (inactivo ? '<span class="badge badge-bad">Baja</span>' : '') +
      '</button>';
  }).join('');
  list.hidden = false;
  input.setAttribute('aria-expanded', 'true');
}

function cerrarAutocomplete() {
  const list = $('#ac-list');
  if (!list) return;
  list.hidden = true;
  $('#placa-input').setAttribute('aria-expanded', 'false');
}

function onPlacaKeydown(e) {
  const abierto = !$('#ac-list').hidden;
  if (e.key === 'ArrowDown' && abierto) {
    e.preventDefault();
    OP.acIndex = Math.min(OP.acIndex + 1, OP.resultados.length - 1);
    renderAutocomplete();
  } else if (e.key === 'ArrowUp' && abierto) {
    e.preventDefault();
    OP.acIndex = Math.max(OP.acIndex - 1, 0);
    renderAutocomplete();
  } else if (e.key === 'Escape' && abierto) {
    e.stopPropagation();
    cerrarAutocomplete();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (abierto && OP.acIndex >= 0) { seleccionarResultado(OP.acIndex); return; }
    if (!OP.lookupDone && OP.placa.length >= 2) {
      buscarPlacaDebounced.cancel();
      consultarPlaca({ seleccionarExacto: true });
      return;
    }
    if (abierto) {
      const exactIdx = OP.resultados.findIndex(v => normalizarPlaca(v.Placa) === OP.placa);
      if (exactIdx !== -1) { seleccionarResultado(exactIdx); return; }
    }
    registrarEntrada();
  }
}

/* ---------- Tarjeta de vehículo / formulario de visitante ---------- */
function tarjetaVehiculoHtml(v) {
  const activo = esActivo(v.Activo);
  const campo = (etiqueta, valor, extra) =>
    '<div class="' + (extra || '') + '"><dt class="field-label !mb-0.5">' + etiqueta + '</dt>' +
    '<dd class="text-[15px] font-semibold text-ink break-words">' + (valor ? escapeHtml(valor) : '<span class="text-ink-faint">—</span>') + '</dd></div>';
  const titulo = [v.Marca, v.Modelo].filter(Boolean).join(' ') || 'Vehículo registrado';
  return '' +
    '<div class="flex items-start justify-between gap-3 flex-wrap">' +
      '<span class="plate plate-xl">' + escapeHtml(v.Placa) + '</span>' +
      (activo
        ? '<span class="badge badge-ok"><i data-lucide="badge-check"></i>Registrado</span>'
        : '<span class="badge badge-bad"><i data-lucide="ban"></i>Dado de baja</span>') +
    '</div>' +
    '<p class="mt-3 font-display font-bold text-lg text-navy leading-tight">' + escapeHtml(titulo) +
      (v.Color ? ' <span class="text-ink-muted font-semibold">· ' + escapeHtml(v.Color) + '</span>' : '') + '</p>' +
    (activo ? '' :
      '<div class="state-block state-bad mt-3 flex items-start gap-2" role="alert">' +
        '<i data-lucide="shield-x" class="w-5 h-5 mt-0.5"></i>' +
        '<div><p class="font-bold text-sm uppercase tracking-wide">Vehículo dado de baja</p>' +
        '<p class="text-xs text-ink mt-0.5">Acceso no autorizado. Comuníquese con el administrador.</p></div>' +
      '</div>') +
    '<dl class="mt-3 pt-3 border-t border-line grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-3">' +
      campo('Marca', v.Marca) +
      campo('Modelo', v.Modelo) +
      campo('Color', v.Color) +
      campo('Tipo de titular', v.TipoTitular) +
      campo('Titular', v.TitularNombre, 'col-span-2') +
    '</dl>';
}

function renderVehiculo() {
  const p = OP.placa;
  const valida = REGEX_PLACA.test(p);
  const hint = $('#placa-hint');

  $('#btn-placa-clear').hidden = !p;

  if (!p) hint.textContent = 'Formato: 5 a 8 letras y números, sin guiones ni espacios.';
  else if (!valida) hint.textContent = p.length + '/8 caracteres · mínimo 5';
  else if (!OP.lookupDone) hint.textContent = 'Consultando catálogo…';
  else if (OP.vehiculo) hint.textContent = 'Vehículo encontrado en el catálogo.';
  else hint.textContent = 'Placa no registrada en el catálogo.';

  $('#veh-skeleton').hidden = !(valida && !OP.lookupDone);

  const card = $('#veh-card');
  card.hidden = !(valida && OP.lookupDone && OP.vehiculo);
  card.innerHTML = card.hidden ? '' : tarjetaVehiculoHtml(OP.vehiculo);

  const visForm = $('#visitor-form');
  visForm.hidden = !(valida && OP.lookupDone && !OP.vehiculo);
  const errEl = $('#vis-lookup-error');
  errEl.hidden = !OP.lookupError;
  errEl.textContent = OP.lookupError;
  if (!visForm.hidden) actualizarFormVisitante();

  const mov = valida ? STATE.dentro.find(m => normalizarPlaca(m.Placa) === p) : null;
  const box = $('#ya-dentro');
  box.hidden = !mov;
  if (mov) {
    $('#ya-dentro-detalle').textContent = 'Entró por ' + (mov.CasetaEntrada || 'caseta desconocida') +
      ' el ' + fechaHoraCorta(mov.FechaHoraEntrada) + ' · ' + formatHoras(mov.horasDentro) + ' dentro.';
    const btn = $('#btn-ya-dentro-salida');
    btn.setAttribute('data-id', mov.ID);
    btn.hidden = !hasPerm('operacion');
  }

  updateEntradaButton();
  refreshIcons();
}

function catalogoSeleccionado() {
  return hasPerm('vehiculo.escribir') &&
    valorCampo('vis-tipo') === 'Visitante' &&
    $('#vis-catalogo').checked &&
    OP.catalogoGuardadoPara !== OP.placa;
}

function actualizarFormVisitante() {
  const puedeCatalogo = hasPerm('vehiculo.escribir') && valorCampo('vis-tipo') === 'Visitante' && OP.catalogoGuardadoPara !== OP.placa;
  $('#vis-catalogo-wrap').hidden = !puedeCatalogo;
  $('#vis-catalogo-fields').hidden = !(puedeCatalogo && $('#vis-catalogo').checked);
  $('#vis-vehiculo-fields').hidden = !(puedeCatalogo && $('#vis-catalogo').checked && $('#vis-vehiculo').checked);
  updateEntradaButton();
}

/** Devuelve el motivo por el que no se puede registrar la entrada ('' si está listo). */
function entradaBloqueo() {
  if (!hasPerm('operacion')) return 'Su rol no permite registrar entradas.';
  if (!STATE.casetaId) return 'Seleccione la caseta activa.';
  if (!OP.placa) return 'Capture o escanee la placa del vehículo.';
  if (!REGEX_PLACA.test(OP.placa)) return 'La placa debe tener de 5 a 8 caracteres alfanuméricos.';
  if (!OP.lookupDone) return 'Consultando catálogo…';
  if (OP.vehiculo && !esActivo(OP.vehiculo.Activo)) return 'Vehículo dado de baja: acceso no autorizado.';
  if (!OP.vehiculo && catalogoSeleccionado()) {
    if (!valorCampo('vis-nombre')) return 'Capture el nombre del visitante para guardarlo en el catálogo.';
    if (!valorCampo('vis-identificacion')) return 'Capture la identificación del visitante para guardarlo en el catálogo.';
    const tel = valorCampo('vis-telefono').replace(/\D/g, '');
    if (tel && tel.length !== 10) return 'El teléfono debe tener 10 dígitos.';
  }
  return '';
}

function updateEntradaButton() {
  const btn = $('#btn-registrar-entrada');
  if (!btn || btn.getAttribute('aria-busy') === 'true') return;
  const motivo = entradaBloqueo();
  btn.disabled = OP.submitting || !!motivo;
  $('#entrada-hint').textContent = OP.submitting ? '' : motivo;
}

function limpiarFormularioEntrada() {
  buscarPlacaDebounced.cancel();
  $('#placa-input').value = '';
  ['vis-nombre', 'vis-identificacion', 'vis-telefono', 'vis-motivo', 'vis-marca', 'vis-modelo', 'vis-color', 'entrada-obs'].forEach(id => {
    $('#' + id).value = '';
  });
  $('#vis-tipo').value = 'Visitante';
  $('#vis-catalogo').checked = false;
  $('#vis-vehiculo').checked = false;
  OP.catalogoGuardadoPara = '';
  OP.resultados = [];
  cambiarPlaca('');
  if (esEscritorio()) $('#placa-input').focus();
}

/* ---------- Registro de entrada ---------- */
async function registrarEntrada() {
  if (OP.submitting) return;
  const motivo = entradaBloqueo();
  if (motivo) { showToast(motivo, 'warning'); return; }

  OP.submitting = true;
  const btn = $('#btn-registrar-entrada');
  try {
    await withBusy(btn, 'Registrando…', async () => {
      const placa = OP.placa;
      const payload = { placa: placa, casetaId: STATE.casetaId };
      const obs = valorCampo('entrada-obs');
      if (obs) payload.observaciones = obs;

      if (!OP.vehiculo) {
        const nombre = valorCampo('vis-nombre');
        payload.tipoUsuario = valorCampo('vis-tipo') || 'Visitante';
        if (nombre) payload.nombreVisitante = nombre;

        if (catalogoSeleccionado()) {
          const tel = valorCampo('vis-telefono').replace(/\D/g, '');
          const visitante = await runGas('guardarCatalogo', 'visitantes', {
            Nombre: nombre,
            Identificacion: valorCampo('vis-identificacion'),
            Motivo: valorCampo('vis-motivo'),
            Telefono: tel
          });
          showToast('Visitante ' + visitante.Nombre + ' agregado al catálogo.', 'success');
          if ($('#vis-vehiculo').checked) {
            try {
              await runGas('guardarCatalogo', 'vehiculos', {
                Placa: placa,
                Marca: valorCampo('vis-marca'),
                Modelo: valorCampo('vis-modelo'),
                Color: valorCampo('vis-color'),
                TipoTitular: 'Visitante',
                TitularID: visitante.ID
              });
              showToast('Placa ' + placa + ' vinculada al visitante en el catálogo de vehículos.', 'success');
            } catch (e) {
              showToast('El visitante se guardó, pero no se pudo registrar el vehículo: ' + e.message, 'warning', 8000);
            }
          }
          OP.catalogoGuardadoPara = placa;
          actualizarFormVisitante();
          if (typeof CAT !== 'undefined' && CAT.cache) {
            delete CAT.cache.visitantes;
            delete CAT.cache.vehiculos;
          }
        }
      }

      const mov = await runGas('registrarEntrada', payload);
      showToast('Entrada registrada: ' + mov.Placa + ' · ' + mov.CasetaEntrada + ' · ' + horaDe(mov.FechaHoraEntrada) +
        (mov.registrado ? '' : ' (vehículo no registrado)'), 'success');
      limpiarFormularioEntrada();
      cargarDentro(true);
    });
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    OP.submitting = false;
    updateEntradaButton();
  }
}

/* ---------- Registro de salida ---------- */
async function registrarSalida(movimientoId, btn) {
  if (!hasPerm('operacion')) { showToast('Su rol no permite registrar salidas.', 'warning'); return false; }
  if (!STATE.casetaId) {
    showToast('Seleccione la caseta activa antes de registrar la salida.', 'warning');
    const sel = $('#op-caseta');
    if (sel) sel.focus();
    return false;
  }
  if (!movimientoId || OP.salidasPendientes[movimientoId]) return false;
  OP.salidasPendientes[movimientoId] = true;
  try {
    const r = await withBusy(btn, 'Registrando…', () =>
      runGas('registrarSalida', { movimientoId: movimientoId, casetaId: STATE.casetaId }));
    if (!r) return false;
    showToast('Salida registrada: ' + r.Placa + ' · ' + (r.CasetaSalida || casetaNombre(STATE.casetaId)) + ' · ' + horaDe(r.FechaHoraSalida), 'success');
    STATE.dentro = STATE.dentro.filter(m => String(m.ID) !== String(movimientoId));
    delete OP.salidasPendientes[movimientoId];
    renderDentro();
    renderVehiculo();
    cargarDentro(true);
    return true;
  } catch (e) {
    showToast(e.message, 'error');
    delete OP.salidasPendientes[movimientoId];
    cargarDentro(true);
    return false;
  }
}

/* ---------- Panel "En Campus" ---------- */
function renderDentroSkeleton() {
  let html = '';
  for (let i = 0; i < 4; i++) {
    html += '<div class="p-3 flex items-center gap-3" aria-hidden="true">' +
      '<div class="skeleton h-8 w-24"></div>' +
      '<div class="flex-1 space-y-2"><div class="skeleton h-3.5 w-3/4"></div><div class="skeleton h-3 w-1/2"></div></div>' +
      '<div class="skeleton h-9 w-20"></div></div>';
  }
  $('#dentro-list').innerHTML = html;
}

async function cargarDentro(silent) {
  if (OP.dentroLoading) return;
  OP.dentroLoading = true;
  if (!silent || !STATE.dentroLoaded) renderDentroSkeleton();
  const refreshBtn = $('#btn-dentro-refresh');
  refreshBtn.disabled = true;
  try {
    const data = await runGas('vehiculosDentro');
    STATE.dentro = Array.isArray(data) ? data : [];
    STATE.dentroLoaded = true;
    OP.dentroError = '';
    $('#dentro-updated').textContent = 'Actualizado ' + horaActual() + ' · se actualiza cada minuto';
  } catch (e) {
    OP.dentroError = e.message;
    if (!silent) showToast('No se pudo cargar la lista de vehículos en campus: ' + e.message, 'error');
  } finally {
    OP.dentroLoading = false;
    refreshBtn.disabled = false;
    renderDentro();
    renderVehiculo();
  }
}

function filtrarDentro() {
  const texto = valorCampo('dentro-search');
  const placaBuscada = normalizarPlaca(texto);
  const textoLower = texto.toLowerCase();
  const caseta = valorCampo('dentro-filter');
  return STATE.dentro.filter(m => {
    if (caseta && String(m.CasetaEntradaID) !== caseta) return false;
    if (!texto) return true;
    return (placaBuscada && normalizarPlaca(m.Placa).indexOf(placaBuscada) !== -1) ||
      String(m.TitularNombre || '').toLowerCase().indexOf(textoLower) !== -1;
  });
}

function filaDentroHtml(m) {
  const alerta = m.alerta === true;
  const puedeSalida = hasPerm('operacion');
  const pendiente = !!OP.salidasPendientes[m.ID];
  const sub = [m.TipoUsuario, m.CasetaEntrada].filter(Boolean).join(' · ');
  return '' +
    '<article class="p-3 flex items-center gap-3 ' + (alerta ? 'row-alerta' : '') + '">' +
      '<div class="flex-1 min-w-0">' +
        '<div class="flex items-center gap-2 flex-wrap">' +
          '<span class="plate plate-solid">' + escapeHtml(m.Placa) + '</span>' +
          (alerta
            ? '<span class="badge badge-alerta"><i data-lucide="triangle-alert"></i>Alerta ≥12 h</span>'
            : '<span class="badge badge-dentro">Dentro</span>') +
        '</div>' +
        '<p class="mt-1.5 text-sm font-semibold text-ink truncate">' + escapeHtml(m.TitularNombre || 'Sin titular registrado') + '</p>' +
        '<p class="text-xs text-ink-muted truncate">' + escapeHtml(sub) + '</p>' +
        '<p class="mt-1 mono text-[11px] font-semibold flex items-center gap-1 ' + (alerta ? 'text-bad' : 'text-navy') + '">' +
          '<i data-lucide="clock" class="w-3.5 h-3.5"></i>' + escapeHtml(horaDe(m.FechaHoraEntrada)) +
          ' · ' + escapeHtml(formatHoras(m.horasDentro)) + '</p>' +
      '</div>' +
      (puedeSalida
        ? '<button type="button" class="btn ' + (alerta ? 'btn-danger' : 'btn-neutral') + ' btn-sm shrink-0 !min-h-[44px]" data-action="salida" data-id="' +
          escapeHtml(m.ID) + '"' + (pendiente ? ' disabled' : '') + ' aria-label="Registrar salida de ' + escapeHtml(m.Placa) + '">' +
          '<i data-lucide="log-out" class="w-4 h-4"></i><span><span class="hidden sm:inline">Registrar </span>Salida</span></button>'
        : '') +
    '</article>';
}

function renderDentro() {
  const list = $('#dentro-list');
  if (!list) return;
  const filas = filtrarDentro();
  const alertas = filas.filter(m => m.alerta === true).length;

  $('#dentro-count').textContent = String(filas.length);
  const alertBadge = $('#dentro-alert-count');
  alertBadge.hidden = !alertas;
  alertBadge.textContent = alertas + (alertas === 1 ? ' alerta' : ' alertas');

  if (OP.dentroError && !STATE.dentroLoaded) {
    list.innerHTML = '<div class="p-6 text-center">' +
      '<i data-lucide="circle-alert" class="w-8 h-8 mx-auto text-bad"></i>' +
      '<p class="mt-2 text-sm font-semibold text-ink">' + escapeHtml(OP.dentroError) + '</p>' +
      '<button type="button" class="btn btn-neutral btn-sm mt-3" data-action="reintentar-dentro">' +
      '<i data-lucide="refresh-cw" class="w-4 h-4"></i>Reintentar</button></div>';
  } else if (!filas.length) {
    const hayFiltro = valorCampo('dentro-search') || valorCampo('dentro-filter');
    list.innerHTML = '<div class="p-6 text-center text-ink-muted">' +
      '<i data-lucide="car-front" class="w-8 h-8 mx-auto text-line"></i>' +
      '<p class="mt-2 text-sm font-semibold">' + (hayFiltro ? 'Sin coincidencias con el filtro aplicado.' : 'No hay vehículos dentro del campus.') + '</p></div>';
  } else {
    list.innerHTML = filas.map(filaDentroHtml).join('');
  }
  refreshIcons();
}

/* =====================================================================
 * Lector QR (html5-qrcode) con respaldo nativo para iframe de GAS
 * ===================================================================== */
function camaraEnVivoPermitida() {
  try {
    const fp = document.featurePolicy;
    if (fp && typeof fp.allowsFeature === 'function' && !fp.allowsFeature('camera')) return false;
  } catch (e) { /* featurePolicy no accesible */ }
  try {
    const pp = document.permissionsPolicy;
    if (pp && typeof pp.allowsFeature === 'function' && !pp.allowsFeature('camera')) return false;
  } catch (e) { /* permissionsPolicy no accesible */ }

  let enIframe = false;
  try { enIframe = window.self !== window.top; } catch (e) { enIframe = true; }
  if (enIframe) {
    const host = String((window.location && window.location.hostname) || '').toLowerCase();
    const ref = String(document.referrer || '').toLowerCase();
    if (host.indexOf('googleusercontent.com') !== -1 ||
        host.indexOf('script.google.com') !== -1 ||
        ref.indexOf('googleusercontent.com') !== -1 ||
        ref.indexOf('script.google.com') !== -1 ||
        !!(window.google && google.script && google.script.run)) {
      return false;
    }
  }
  return !!(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function');
}

function setQrStatus(msg, tipo) {
  const el = $('#qr-status');
  if (!msg) {
    el.hidden = true;
    el.innerHTML = '';
    return;
  }
  const icon = tipo === 'warn' ? 'triangle-alert' : tipo === 'busy' ? 'loader-circle' : 'info';
  el.hidden = false;
  el.className = 'mt-3 text-sm font-semibold flex items-start gap-2 ' + (tipo === 'warn' ? 'text-warn' : 'text-navy');
  el.innerHTML = '<i data-lucide="' + icon + '" class="w-4 h-4 mt-0.5 ' + (tipo === 'busy' ? 'animate-spin' : '') + '"></i><span>' + escapeHtml(msg) + '</span>';
  refreshIcons();
}

/** Extrae la placa de un QR: JSON {placa}, URL ?placa=, "PLACA: X", texto con separadores o placa sola. */
function extraerPlacaDeQR(raw) {
  const t = String(raw || '').trim();
  if (!t) return '';
  try {
    const o = JSON.parse(t);
    if (o && typeof o === 'object') {
      const v = o.placa || o.Placa || o.PLACA;
      if (v) return normalizarPlaca(v);
    }
  } catch (e) { /* no es JSON */ }
  const url = t.match(/[?&#]placa=([^&#]+)/i);
  if (url) return normalizarPlaca(decodeURIComponent(url[1]));
  const etiqueta = t.match(/PLACA\s*[:=]\s*([A-Za-z0-9\- ]{5,12})/i);
  if (etiqueta) return normalizarPlaca(etiqueta[1]);
  const tokens = t.split(/[|;,\n\r\t]+/).map(normalizarPlaca).filter(x => REGEX_PLACA.test(x));
  if (tokens.length) return tokens[0];
  return normalizarPlaca(t);
}

function procesarTextoQR(texto) {
  const placa = extraerPlacaDeQR(texto);
  if (!REGEX_PLACA.test(placa)) {
    setQrStatus('El código leído no contiene una placa válida. Intente con otra calcomanía.', 'warn');
    return false;
  }
  closeModal('modal-qr');
  aplicarPlaca(placa);
  showToast('QR leído: placa ' + placa, 'success', 2500);
  return true;
}

function abrirLectorQR() {
  $('#btn-qr-retry').hidden = true;
  const enVivo = camaraEnVivoPermitida();
  $('#qr-live-wrap').hidden = !enVivo;
  $('#qr-native-hero').hidden = enVivo;
  setQrStatus('', 'info');
  openModal('modal-qr');
  if (!enVivo) return;
  if (typeof window.Html5Qrcode === 'undefined') {
    $('#qr-live-wrap').hidden = true;
    $('#qr-native-hero').hidden = false;
    setQrStatus('No se pudo cargar el lector de cámara en vivo. Use las opciones de foto o archivo.', 'warn');
    return;
  }
  iniciarCamaraQR();
}

async function iniciarCamaraQR() {
  if (!camaraEnVivoPermitida()) {
    $('#qr-live-wrap').hidden = true;
    $('#qr-native-hero').hidden = false;
    return;
  }
  $('#btn-qr-retry').hidden = true;
  await detenerCamaraQR();
  if (typeof window.Html5Qrcode === 'undefined') return;
  setQrStatus('Iniciando cámara en vivo…', 'busy');
  OP.qrProcesando = false;
  const sc = new Html5Qrcode('qr-reader', { verbose: false });
  OP.scanner = sc;
  try {
    await sc.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: (w, h) => {
          const s = Math.max(120, Math.floor(Math.min(w, h) * 0.7));
          return { width: s, height: s };
        }
      },
      texto => {
        if (OP.qrProcesando) return;
        OP.qrProcesando = true;
        if (!procesarTextoQR(texto)) setTimeout(() => { OP.qrProcesando = false; }, 1500);
      },
      () => { /* fotogramas sin QR: se ignoran */ }
    );
    if ($('#modal-qr').hidden || OP.scanner !== sc) {
      // El modal se cerró mientras la cámara arrancaba: liberar este lector concreto.
      try { await sc.stop(); sc.clear(); } catch (err) { /* ya detenido */ }
      return;
    }
    setQrStatus('Apunte la cámara al código QR de la calcomanía del vehículo.', 'info');
  } catch (e) {
    if (OP.scanner !== sc) return;
    await detenerCamaraQR();
    $('#qr-live-wrap').hidden = true;
    $('#qr-native-hero').hidden = false;
    setQrStatus('La cámara en vivo no está disponible. Use el botón para escanear desde cámara o archivo.', 'warn');
    $('#btn-qr-retry').hidden = false;
  }
}

async function detenerCamaraQR() {
  const sc = OP.scanner;
  OP.scanner = null;
  if (!sc) return;
  try { if (sc.isScanning) await sc.stop(); } catch (e) { /* ya detenido */ }
  try { sc.clear(); } catch (e) { /* sin contenido que limpiar */ }
}

async function leerQRDesdeArchivo(e) {
  const input = e.target;
  const file = input.files && input.files[0];
  if (!file) return;
  if (typeof window.Html5Qrcode === 'undefined') {
    setQrStatus('No se pudo cargar el lector QR. Verifique la conexión a internet.', 'warn');
    input.value = '';
    return;
  }
  await detenerCamaraQR();
  setQrStatus('Analizando imagen…', 'busy');
  const lector = new Html5Qrcode('qr-file-host', { verbose: false });
  try {
    const texto = await lector.scanFile(file, false);
    procesarTextoQR(texto);
  } catch (err) {
    setQrStatus('No se detectó un código QR en la imagen. Intente acercar la cámara, enfocar y mejorar la iluminación.', 'warn');
    $('#btn-qr-retry').hidden = !camaraEnVivoPermitida();
  } finally {
    try { lector.clear(); } catch (err) { /* sin contenido que limpiar */ }
    input.value = '';
  }
}

  const estanciaMin = Number(k.estanciaPromedioMin || 0);
  const sinSalida = Number(k.salidasNoRegistradas || 0);
  const pctSinSalida = Number(k.porcentajeSinSalida || 0);
  const alertas = Number(k.alertasEstancia || 0);

  $('#kpi-total-entradas').textContent = totalEntradas.toLocaleString('es-MX');
  $('#kpi-vehiculos-unicos').textContent = Number(k.vehiculosUnicos || 0).toLocaleString('es-MX') + ' vehículos únicos';
  $('#kpi-total-salidas').textContent = totalSalidas.toLocaleString('es-MX');
  const tasa = totalEntradas ? Math.round((totalSalidas * 1000) / totalEntradas) / 10 : 0;
  $('#kpi-tasa-salidas').textContent = tasa + '% con salida registrada';
  $('#kpi-dentro-ahora').textContent = dentroAhora.toLocaleString('es-MX');
  $('#kpi-hora-pico').textContent = k.horaPico || '-';

  const porHora = Array.isArray(data.porHora) ? data.porHora : [];
  const picoObj = porHora.find(x => x.hora === k.horaPico);
  $('#kpi-hora-pico-detalle').textContent = (k.horaPico && k.horaPico !== '-' && picoObj)
    ? picoObj.total + ' ingresos en esa hora'
    : 'Sin registros en el período';

  $('#kpi-estancia-min').textContent = estanciaMin + ' min';
  $('#kpi-estancia-fmt').textContent = 'Equivalente a ' + formatHoras(estanciaMin / 60);

  $('#kpi-sin-salida').textContent = sinSalida.toLocaleString('es-MX');
  $('#kpi-pct-sin-salida').textContent = pctSinSalida + '%';
  $('#kpi-alertas-estancia').textContent = alertas.toLocaleString('es-MX');

  const cardAlertas = $('#kpi-alertas-card');
  const badgeAlertas = $('#kpi-alertas-badge');
  if (alertas > 0) {
    cardAlertas.className = 'p-3 rounded border-2 border-bad bg-bad-bg/60 flex items-center justify-between gap-3';
    badgeAlertas.className = 'badge badge-alerta';
    badgeAlertas.textContent = 'Atención';
  } else {
    cardAlertas.className = 'p-3 rounded border border-line bg-mist flex items-center justify-between gap-3';
    badgeAlertas.className = 'badge badge-ok';
    badgeAlertas.textContent = 'Sin alertas';
  }
}

function destruirChart(clave) {
  if (REP.charts[clave]) {
    REP.charts[clave].destroy();
    REP.charts[clave] = null;
  }
}

function chartBaseOptions() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 250 },
    plugins: {
      legend: { labels: { color: '#1C2530', font: { family: 'Inter, sans-serif', size: 12, weight: '600' }, boxWidth: 12 } }
    }
  };
}

function renderChartsReporte(data) {
  ['hora', 'caseta', 'tipo', 'dia'].forEach(destruirChart);
  if (typeof window.Chart === 'undefined') {
    ['hora', 'caseta', 'tipo', 'dia'].forEach(id => { $('#empty-chart-' + id).hidden = false; });
    showToast('No se pudo cargar la librería de gráficas (Chart.js).', 'warning');
    return;
  }

  // a) Barras: Afluencia por horario (00:00 a 23:00)
  const porHora = Array.isArray(data.porHora) ? data.porHora : [];
  const totalHora = porHora.reduce((s, x) => s + Number(x.total || 0), 0);
  $('#empty-chart-hora').hidden = totalHora > 0;
  if (totalHora > 0) {
    const horaPico = (data.kpis && data.kpis.horaPico) || '';
    const ctxHora = document.getElementById('chart-por-hora').getContext('2d');
    REP.charts.hora = new Chart(ctxHora, {
      type: 'bar',
      data: {
        labels: porHora.map(x => x.hora),
        datasets: [{
          label: 'Entradas',
          data: porHora.map(x => x.total),
          backgroundColor: porHora.map(x => x.hora === horaPico ? '#D96B16' : '#0F2B46'),
          borderRadius: 3
        }]
      },
      options: Object.assign(chartBaseOptions(), {
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#4A5563', font: { family: 'JetBrains Mono, monospace', size: 10 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 12 } },
          y: { beginAtZero: true, ticks: { precision: 0, color: '#4A5563', font: { family: 'JetBrains Mono, monospace', size: 11 } }, grid: { color: '#DFE5EC' } }
        }
      })
    });
  }

  // b) Barras horizontales: Entradas por caseta vs sinSalidaPorCaseta
  const porCaseta = Array.isArray(data.porCaseta) ? data.porCaseta : [];
  const sinCaseta = Array.isArray(data.sinSalidaPorCaseta) ? data.sinSalidaPorCaseta : [];
  const mapEntCas = {};
  const mapSinCas = {};
  porCaseta.forEach(x => { mapEntCas[x.caseta] = Number(x.total || 0); });
  sinCaseta.forEach(x => { mapSinCas[x.caseta] = Number(x.total || 0); });
  const casetasLabels = Array.from(new Set(porCaseta.map(x => x.caseta).concat(sinCaseta.map(x => x.caseta))))
    .sort((a, b) => (mapEntCas[b] || 0) - (mapEntCas[a] || 0));

  $('#empty-chart-caseta').hidden = casetasLabels.length > 0;
  if (casetasLabels.length > 0) {
    const datasetsCas = [{
      label: 'Entradas',
      data: casetasLabels.map(c => mapEntCas[c] || 0),
      backgroundColor: '#0F2B46',
      borderRadius: 3
    }];
    if (sinCaseta.some(x => Number(x.total || 0) > 0)) {
      datasetsCas.push({
        label: 'Sin salida',
        data: casetasLabels.map(c => mapSinCas[c] || 0),
        backgroundColor: '#D96B16',
        borderRadius: 3
      });
    }
    const ctxCas = document.getElementById('chart-por-caseta').getContext('2d');
    REP.charts.caseta = new Chart(ctxCas, {
      type: 'bar',
      data: { labels: casetasLabels, datasets: datasetsCas },
      options: Object.assign(chartBaseOptions(), {
        indexAxis: 'y',
        scales: {
          x: { beginAtZero: true, ticks: { precision: 0, color: '#4A5563', font: { family: 'JetBrains Mono, monospace', size: 11 } }, grid: { color: '#DFE5EC' } },
          y: { grid: { display: false }, ticks: { color: '#1C2530', font: { family: 'Inter, sans-serif', size: 11, weight: '600' } } }
        }
      })
    });
  }

  // c) Dona: Distribución por tipo de usuario
  const porTipo = Array.isArray(data.porTipo) ? data.porTipo.slice().sort((a, b) => b.total - a.total) : [];
  const totalTipo = porTipo.reduce((s, x) => s + Number(x.total || 0), 0);
  $('#empty-chart-tipo').hidden = totalTipo > 0;
  const legendEl = $('#rep-tipo-legend');
  if (totalTipo > 0) {
    const colores = porTipo.map((_, i) => CHART_PALETTE[i % CHART_PALETTE.length]);
    const ctxTipo = document.getElementById('chart-por-tipo').getContext('2d');
    REP.charts.tipo = new Chart(ctxTipo, {
      type: 'doughnut',
      data: {
        labels: porTipo.map(x => x.tipo),
        datasets: [{ data: porTipo.map(x => x.total), backgroundColor: colores, borderColor: '#FFFFFF', borderWidth: 2 }]
      },
      options: Object.assign(chartBaseOptions(), {
        cutout: '62%',
        plugins: { legend: { display: false } }
      })
    });
    legendEl.innerHTML = porTipo.map((x, i) => {
      const pct = Math.round((Number(x.total || 0) * 1000) / totalTipo) / 10;
      return '<div class="flex items-center justify-between gap-2">' +
        '<span class="flex items-center gap-2 min-w-0 truncate"><span class="w-3 h-3 rounded-sm shrink-0" style="background:' + colores[i] + '"></span>' +
        '<span class="font-medium text-ink truncate">' + escapeHtml(x.tipo || 'Sin especificar') + '</span></span>' +
        '<span class="mono font-bold text-navy shrink-0">' + x.total + ' (' + pct + '%)</span>' +
      '</div>';
    }).join('');
  } else {
    legendEl.innerHTML = '<p class="text-ink-muted text-center">Sin datos</p>';
  }

  // d) Tendencia por día (porDia / sinSalidaPorDia)
  const porDia = Array.isArray(data.porDia) ? data.porDia : [];
  const sinDia = Array.isArray(data.sinSalidaPorDia) ? data.sinSalidaPorDia : [];
  const mapDia = {};
  const mapSinDia = {};
  porDia.forEach(x => { mapDia[x.dia] = Number(x.total || 0); });
  sinDia.forEach(x => { mapSinDia[x.dia] = Number(x.total || 0); });
  const dias = Array.from(new Set(porDia.map(x => x.dia).concat(sinDia.map(x => x.dia)))).sort();

  $('#empty-chart-dia').hidden = dias.length > 0;
  if (dias.length > 0) {
    const labelsDia = dias.map(d => d.length >= 10 ? d.substring(8, 10) + '/' + d.substring(5, 7) : d);
    const datasetsDia = [{
      type: 'bar',
      label: 'Entradas',
      data: dias.map(d => mapDia[d] || 0),
      backgroundColor: '#0F2B46',
      borderRadius: 3
    }];
    if (sinDia.some(x => Number(x.total || 0) > 0)) {
      datasetsDia.push({
        type: 'line',
        label: 'Sin salida',
        data: dias.map(d => mapSinDia[d] || 0),
        borderColor: '#D96B16',
        backgroundColor: '#D96B16',
        borderWidth: 2,
        pointRadius: 3,
        tension: 0.2
      });
    }
    const ctxDia = document.getElementById('chart-por-dia').getContext('2d');
    REP.charts.dia = new Chart(ctxDia, {
      data: { labels: labelsDia, datasets: datasetsDia },
      options: Object.assign(chartBaseOptions(), {
        scales: {
          x: { grid: { display: false }, ticks: { color: '#4A5563', font: { family: 'JetBrains Mono, monospace', size: 11 } } },
          y: { beginAtZero: true, ticks: { precision: 0, color: '#4A5563', font: { family: 'JetBrains Mono, monospace', size: 11 } }, grid: { color: '#DFE5EC' } }
        }
      })
    });
  }
}

function renderMasFrecuentes(data) {
  const lista = Array.isArray(data.masFrecuentes) ? data.masFrecuentes : [];
  $('#rep-frecuentes-count').textContent = String(lista.length);
  const tbody = $('#rep-frecuentes-tbody');
  if (!lista.length) {
    tbody.innerHTML =
      '<tr><td colspan="5" class="p-6 text-center text-ink-muted">No hay registros de frecuencia en el período seleccionado.</td></tr>';
    return;
  }
  const maxVisitas = Math.max(1, Number(lista[0].visitas || 1));
  const puedeConsultar = hasPerm('consulta');
  tbody.innerHTML = lista.map((item, idx) => {
    const pct = Math.round((Number(item.visitas || 0) * 100) / maxVisitas);
    const placaHtml = puedeConsultar
      ? '<button type="button" class="plate plate-solid hover:opacity-90" data-ver-placa="' + escapeHtml(item.placa) + '" title="Ver movimientos de esta placa">' + escapeHtml(item.placa) + '</button>'
      : '<span class="plate plate-solid">' + escapeHtml(item.placa) + '</span>';

      '<td class="py-3 px-4">' + placaHtml + '</td>' +
      '<td class="py-3 px-4 font-semibold text-ink">' + escapeHtml(item.titular || 'Sin titular registrado') + '</td>' +
      '<td class="py-3 px-4"><span class="badge badge-info">' + escapeHtml(item.tipo || '—') + '</span></td>' +
      '<td class="py-3 px-4 text-right">' +
        '<div class="inline-flex flex-col items-end gap-1 min-w-[100px]">' +

          '<div class="w-24 h-1.5 bg-mist rounded overflow-hidden"><div class="h-full bg-accent" style="width:' + pct + '%"></div></div>' +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join('');
}

async function exportarReporte(formato, btn) {
  if (!hasPerm('reportes')) { showToast('No tiene permiso para exportar reportes.', 'warning'); return; }
  const filtros = leerFiltrosReportes();
  if (filtros.desde && filtros.hasta && filtros.desde > filtros.hasta) {
    showToast('La fecha "Desde" no puede ser mayor que la fecha "Hasta".', 'warning');
    return;
  }
  try {
    const res = await withBusy(btn, 'Exportando…', () => runGas('exportarMovimientos', filtros, formato));
    if (!res) return;
    descargarArchivoBase64(res);
    showToast('Archivo generado: ' + (res.nombre || formato.toUpperCase()), 'success');
  } catch (e) {
    showToast('No se pudo exportar: ' + e.message, 'error');
  }
}

const REGEX_CORREO = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

const buscarCatalogoDebounced = debounce(() => cargarCatalogoActual(), 250);

function puedeEscribirCatalogo(cat) {
  if (cat === 'vehiculos' || cat === 'visitantes') return hasPerm('vehiculo.escribir');
  return hasPerm('catalogo.escribir');
}

function initCatalogos() {
  $$('[data-cat-tab]').forEach(btn => {
    btn.addEventListener('click', () => cambiarTabCatalogo(btn.getAttribute('data-cat-tab')));
  });

  $('#cat-search').addEventListener('input', buscarCatalogoDebounced);
  $('#cat-estado-filter').addEventListener('change', renderCatalogoTabla);
  $('#btn-cat-refresh').addEventListener('click', () => {
    delete CAT.cache[CAT.actual];
    cargarCatalogoActual();
  });
  $('#btn-cat-nuevo').addEventListener('click', () => abrirModalCatalogo(''));

  $('#cat-tbody').addEventListener('click', e => {
    const btn = e.target.closest('[data-cat-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-cat-action');
    const id = btn.getAttribute('data-id');
    if (action === 'qr') abrirModalPaseQR(id);
    else if (action === 'editar') abrirModalCatalogo(id);
    else if (action === 'eliminar') abrirModalEliminarCatalogo(id);
    else if (action === 'reintentar') cargarCatalogoActual();
  });

  $('#veh-f-placa').addEventListener('input', e => {
    const limpia = normalizarPlaca(e.target.value).slice(0, 8);
    if (e.target.value !== limpia) e.target.value = limpia;
  });
  $('#veh-f-tipo-titular').addEventListener('change', () => {
    cargarOpcionesTitularVehiculo(valorCampo('veh-f-tipo-titular'), '');
  });

  $('#form-catalogo').addEventListener('submit', e => {
    e.preventDefault();
    guardarRegistroCatalogo();
  });
  $('#btn-cat-confirmar-eliminar').addEventListener('click', confirmarEliminarCatalogo);
  $('#btn-qr-imprimir').addEventListener('click', () => window.print());

  // Gestión de usuarios
  $('#btn-ir-usuarios').addEventListener('click', () => {
    const sec = $('#sec-usuarios');
    if (sec && !sec.hidden) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('#usr-search').addEventListener('input', renderUsuariosTabla);
  $('#btn-usr-refresh').addEventListener('click', () => cargarUsuarios());
  $('#btn-usr-nuevo').addEventListener('click', () => abrirModalUsuario(''));
  $('#form-usuario').addEventListener('submit', e => {
    e.preventDefault();
    guardarRegistroUsuario();
  });
  $('#usr-tbody').addEventListener('click', e => {
    const btn = e.target.closest('[data-usr-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-usr-action');
    const id = btn.getAttribute('data-id');
    if (action === 'editar') abrirModalUsuario(id);
    else if (action === 'toggle') alternarEstadoUsuario(id, btn.getAttribute('data-activo') === 'true', btn);
    else if (action === 'reintentar') cargarUsuarios();
  });

  VIEW_HOOKS.catalogos = {
    onShow: () => {
      actualizarControlesCatalogo();
      if (!CAT.cache[CAT.actual]) cargarCatalogoActual();
      else renderCatalogoTabla();
      if (hasPerm('usuarios') && !CAT.usuariosLoaded) cargarUsuarios();
    }
  };
}

function actualizarControlesCatalogo() {
  const cfg = CAT_CONFIG[CAT.actual];
  $$('[data-cat-tab]').forEach(btn => {
    const activo = btn.getAttribute('data-cat-tab') === CAT.actual;
    btn.setAttribute('aria-selected', String(activo));
    btn.className = activo
      ? 'flex items-center gap-2 px-3 py-2.5 text-sm font-semibold rounded-t border-b-2 border-accent bg-white text-navy whitespace-nowrap shrink-0'
      : 'flex items-center gap-2 px-3 py-2.5 text-sm font-medium rounded-t border-b-2 border-transparent text-ink-muted hover:text-navy whitespace-nowrap shrink-0';
    const badge = btn.querySelector('.badge');
    if (badge) badge.className = 'badge ' + (activo ? 'badge-count' : 'badge-info');
  });

  $('#cat-search').placeholder = cfg.busquedaPh;
  $('#cat-estado-wrap').hidden = !cfg.tieneEstado;
  if (!cfg.tieneEstado) $('#cat-estado-filter').value = '';

  const puedeEscribir = puedeEscribirCatalogo(CAT.actual);
  const btnNuevo = $('#btn-cat-nuevo');
  btnNuevo.hidden = !puedeEscribir;
  $('#btn-cat-nuevo-label').textContent = cfg.nuevoLabel;

  let notaPerm = 'Solo lectura';
  if (hasPerm('catalogo.escribir')) notaPerm = 'Alta, edición y eliminación habilitadas';
  else if (puedeEscribir) notaPerm = 'Alta y edición habilitadas en ' + cfg.titulo.toLowerCase();
  $('#cat-perm-hint').textContent = notaPerm;
}

function cambiarTabCatalogo(cat) {
  if (!CAT_CONFIG[cat] || CAT.actual === cat) return;
  buscarCatalogoDebounced.cancel();
  CAT.actual = cat;
  $('#cat-search').value = '';
  $('#cat-estado-filter').value = '';
  actualizarControlesCatalogo();
  cargarCatalogoActual();
}

async function cargarCatalogoActual() {
  if (!hasPerm('catalogo.leer')) return;
  const cat = CAT.actual;
  const texto = valorCampo('cat-search');
  const seq = ++CAT.seq;
  CAT.loading = true;
  const cols = CAT_CONFIG[cat].cols.length;
  renderTablaSkeleton('cat-tbody', cols, 5);
  renderCatalogoHeader();

  try {
    const rows = await runGas('listarCatalogo', cat, texto);
    if (seq !== CAT.seq || cat !== CAT.actual) return;
    CAT.rows = Array.isArray(rows) ? rows : [];
    if (!texto) {
      CAT.cache[cat] = CAT.rows;
      $('#cat-count-' + cat).textContent = String(CAT.rows.length);
    }
    $('#cat-updated').textContent = 'Actualizado ' + horaActual() + ' · Catálogo: ' + CAT_CONFIG[cat].titulo;
    renderCatalogoTabla();
  } catch (e) {
    if (seq !== CAT.seq || cat !== CAT.actual) return;
    $('#cat-tbody').innerHTML =
      '<tr><td colspan="' + cols + '" class="p-6 text-center">' +
        '<i data-lucide="circle-alert" class="w-8 h-8 mx-auto text-bad"></i>' +
        '<p class="mt-2 font-semibold text-ink">' + escapeHtml(e.message) + '</p>' +
        '<button type="button" class="btn btn-neutral btn-sm mt-3" data-cat-action="reintentar">' +
        '<i data-lucide="refresh-cw" class="w-4 h-4"></i>Reintentar</button>' +
      '</td></tr>';
    $('#cat-footer-count').textContent = 'Error al cargar';
    refreshIcons();
    showToast('Error al cargar ' + CAT_CONFIG[cat].titulo + ': ' + e.message, 'error');
  } finally {
    if (seq === CAT.seq) CAT.loading = false;
  }
}

function renderCatalogoHeader() {
  const cols = CAT_CONFIG[CAT.actual].cols;
  $('#cat-thead').innerHTML =
    '<tr class="border-b border-line bg-mist/60">' +
    cols.map((c, idx) =>
      '<th class="py-2.5 px-3 mono text-[11px] font-bold uppercase tracking-wider text-ink-muted ' +
      (idx === cols.length - 1 ? 'text-right' : '') + '">' + escapeHtml(c) + '</th>'
    ).join('') + '</tr>';
}

  if (puedeEditar) {

      escapeHtml(r.ID) + '" title="Editar ' + escapeHtml(etiqueta) + '" aria-label="Editar ' + escapeHtml(etiqueta) + '">' +
      '<i data-lucide="pencil" class="w-4 h-4"></i></button>';
  }
  if (puedeEliminar) {
    html += '<button type="button" class="btn btn-danger btn-icon !min-h-[36px] !w-9" data-cat-action="eliminar" data-id="' +
      escapeHtml(r.ID) + '" title="Eliminar ' + escapeHtml(etiqueta) + '" aria-label="Eliminar ' + escapeHtml(etiqueta) + '">' +
      '<i data-lucide="trash-2" class="w-4 h-4"></i></button>';
  }
  if (cat !== 'vehiculos' && !puedeEditar && !puedeEliminar) {
    html += '<span class="mono text-[11px] text-ink-faint">Solo lectura</span>';
  }
  return html + '</div>';
}

/* ---------- Modal Alta / Edición de Catálogo ---------- */
async function cargarOpcionesTitularVehiculo(tipo, selectedId) {
  const sel = $('#veh-f-titular-id');
  const label = $('#veh-f-titular-label');
  const hint = $('#veh-f-titular-hint');
  const mapa = { Estudiante: 'estudiantes', Docente: 'empleados', Administrativo: 'empleados', Visitante: 'visitantes' };
  const catOrigen = mapa[tipo] || 'estudiantes';
  const esVisitante = tipo === 'Visitante';

  label.textContent = esVisitante ? 'Visitante (opcional)' : 'Titular (' + tipo + ') *';
  sel.disabled = true;
  sel.innerHTML = '<option value="">Cargando catálogo de ' + escapeHtml(catOrigen) + '…</option>';
  hint.textContent = '';

  const seq = ++CAT.titularSeq;
  try {
    let lista = CAT.cache[catOrigen];
    if (!lista) {
      const data = await runGas('listarCatalogo', catOrigen, '');
      lista = Array.isArray(data) ? data : [];
      CAT.cache[catOrigen] = lista;
      $('#cat-count-' + catOrigen).textContent = String(lista.length);
    }
    if (seq !== CAT.titularSeq) return;

    let filtrados = lista;
    if (tipo === 'Docente' || tipo === 'Administrativo') {
      filtrados = lista.filter(x => x.Tipo === tipo);
    }

    const placeholder = esVisitante
      ? '— Sin visitante vinculado (opcional) —'
      : (filtrados.length ? 'Seleccione el titular…' : 'No hay registros de tipo ' + tipo);
    let opts = '<option value="">' + escapeHtml(placeholder) + '</option>';

    opts += filtrados.map(item => {
      const clave = item.Matricula || item.NumEmpleado || item.Identificacion || item.ID;
      const inactivo = item.Activo !== undefined && !esActivo(item.Activo) ? ' [Inactivo]' : '';
      return '<option value="' + escapeHtml(item.ID) + '">' +
        escapeHtml(item.Nombre + ' (' + clave + ')' + inactivo) + '</option>';
    }).join('');

    sel.innerHTML = opts;
    sel.disabled = !esVisitante && filtrados.length === 0;
    if (selectedId && filtrados.some(x => String(x.ID) === String(selectedId))) {
      sel.value = selectedId;
    } else {
      sel.value = '';
    }
    hint.textContent = filtrados.length
      ? filtrados.length + ' opciones disponibles en ' + CAT_CONFIG[catOrigen].titulo + '.'
      : (esVisitante ? 'Puede guardar el vehículo sin vincular a un visitante específico.' : 'Debe registrar primero un ' + tipo + ' en su catálogo.');
  } catch (e) {
    if (seq !== CAT.titularSeq) return;
    sel.innerHTML = '<option value="">Error al cargar titulares</option>';
    sel.disabled = false;
    hint.textContent = e.message;
  }
}

function construirPayloadCatalogo(cat) {
  const id = valorCampo('cat-f-id');
  const datos = {};
  if (id) datos.ID = id;

  const validarTel = raw => {
    if (!raw) return '';
    const d = String(raw).replace(/\D/g, '');
    if (d.length !== 10) throw new Error('El teléfono debe tener 10 dígitos.');
    return d;
  };
  const validarCorreo = correo => {
    if (correo && !REGEX_CORREO.test(correo)) throw new Error('Correo con formato inválido.');
    return correo;
  };

  if (cat === 'vehiculos') {
    const placa = normalizarPlaca(valorCampo('veh-f-placa'));
    if (!REGEX_PLACA.test(placa)) throw new Error('Placa inválida (5 a 8 caracteres alfanuméricos).');
    const tipo = valorCampo('veh-f-tipo-titular');
    const titularId = valorCampo('veh-f-titular-id');
    if (tipo !== 'Visitante' && !titularId) throw new Error('Debe seleccionar el titular del vehículo.');
    datos.Placa = placa;
    datos.TipoTitular = tipo;
    datos.TitularID = titularId;
    datos.Marca = valorCampo('veh-f-marca');
    datos.Modelo = valorCampo('veh-f-modelo');
    datos.Color = valorCampo('veh-f-color');
    datos.Activo = $('#veh-f-activo').checked;
  } else if (cat === 'empleados') {
    const num = valorCampo('emp-f-num');
    const nombre = valorCampo('emp-f-nombre');
    const tipo = valorCampo('emp-f-tipo');
    if (!num) throw new Error('El número de empleado es obligatorio.');
    if (!nombre) throw new Error('El nombre del empleado es obligatorio.');
    if (tipo !== 'Docente' && tipo !== 'Administrativo') throw new Error('Seleccione el tipo de empleado.');
    datos.NumEmpleado = num;
    datos.Nombre = nombre;
    datos.Tipo = tipo;
    datos.Departamento = valorCampo('emp-f-depto');
    datos.Correo = validarCorreo(valorCampo('emp-f-correo'));
    datos.Telefono = validarTel(valorCampo('emp-f-telefono'));
    datos.Activo = $('#emp-f-activo').checked;
  } else if (cat === 'estudiantes') {
    const mat = valorCampo('est-f-matricula');
    const nombre = valorCampo('est-f-nombre');
    if (!mat) throw new Error('La matrícula es obligatoria.');
    if (!nombre) throw new Error('El nombre del estudiante es obligatorio.');
    datos.Matricula = mat;
    datos.Nombre = nombre;
    datos.Carrera = valorCampo('est-f-carrera');
    datos.Correo = validarCorreo(valorCampo('est-f-correo'));
    datos.Telefono = validarTel(valorCampo('est-f-telefono'));
    datos.Activo = $('#est-f-activo').checked;
  } else if (cat === 'visitantes') {
    const nombre = valorCampo('vis-f-nombre');
    const ident = valorCampo('vis-f-identificacion');
    if (!nombre) throw new Error('El nombre del visitante es obligatorio.');
    if (!ident) throw new Error('La identificación del visitante es obligatoria.');
    datos.Nombre = nombre;
    datos.Identificacion = ident;
    datos.Motivo = valorCampo('vis-f-motivo');
    datos.Telefono = validarTel(valorCampo('vis-f-telefono'));
  } else if (cat === 'casetas') {
    const nombre = valorCampo('cas-f-nombre');
    if (!nombre) throw new Error('El nombre de la caseta es obligatorio.');
    datos.Nombre = nombre;
    datos.Ubicacion = valorCampo('cas-f-ubicacion');
    datos.Tipo = valorCampo('cas-f-tipo') || 'Entrada/Salida';
    datos.Activa = $('#cas-f-activa').checked;
  }
  return datos;
}

async function guardarRegistroCatalogo() {
  const cat = CAT.actual;
  let datos;
  try {
    datos = construirPayloadCatalogo(cat);
  } catch (e) {
    showToast(e.message, 'warning');
    return;
  }
  const btn = $('#btn-cat-guardar');
  try {
    const r = await withBusy(btn, 'Guardando…', () => runGas('guardarCatalogo', cat, datos));
    if (!r) return;
    delete CAT.cache[cat];
    if (cat === 'empleados' || cat === 'estudiantes' || cat === 'visitantes') delete CAT.cache.vehiculos;
    if (cat === 'casetas') cargarCasetas();
    closeModal('modal-catalogo');
    showToast(datos.ID ? 'Registro actualizado correctamente.' : 'Registro creado correctamente.', 'success');
    cargarCatalogoActual();
  } catch (e) {
    showToast(e.message, 'error', 7000);
  }
}

/* ---------- Eliminación con integridad referencial ---------- */
function abrirModalEliminarCatalogo(id) {
  if (!hasPerm('catalogo.escribir')) {
    showToast('Solo los administradores pueden eliminar registros.', 'warning');
    return;
  }
  const cat = CAT.actual;
  const reg = CAT.rows.find(r => String(r.ID) === String(id));
  if (!reg) return;
  CAT.deleteTarget = { cat: cat, id: reg.ID };
  const nombre = reg.Placa || reg.Nombre || reg.ID;
  $('#del-cat-detalle').textContent = CAT_CONFIG[cat].titulo + ' · ' + nombre + ' (' + reg.ID + ')';
  openModal('modal-cat-eliminar');
}

async function confirmarEliminarCatalogo() {
  if (!CAT.deleteTarget) return;
  const target = CAT.deleteTarget;
  const btn = $('#btn-cat-confirmar-eliminar');
  try {
    const ok = await withBusy(btn, 'Eliminando…', () => runGas('eliminarCatalogo', target.cat, target.id));
    if (!ok) return;
    delete CAT.cache[target.cat];
    if (target.cat === 'casetas') cargarCasetas();
    CAT.deleteTarget = null;
    closeModal('modal-cat-eliminar');
    showToast('Registro eliminado del catálogo.', 'success');
    cargarCatalogoActual();
  } catch (e) {
    closeModal('modal-cat-eliminar');
    showToast(e.message, 'error', 8000);
  }
}

/* ---------- Modal Pase Vehicular QR (qrcodejs) ---------- */
function abrirModalPaseQR(id) {
  const v = CAT.rows.find(r => String(r.ID) === String(id)) ||
    (CAT.cache.vehiculos || []).find(r => String(r.ID) === String(id));
  if (!v) return;

  const placa = normalizarPlaca(v.Placa);
  const activo = esActivo(v.Activo);
  const codeHost = $('#qr-pase-code');
  codeHost.innerHTML = '';

  if (typeof window.QRCode === 'undefined') {
    codeHost.innerHTML = '<p class="text-xs text-bad font-semibold p-4">No se pudo cargar la librería qrcodejs.</p>';
  } else {
    new QRCode(codeHost, {
      text: placa,
      width: 176,
      height: 176,
      colorDark: '#0F2B46',
      colorLight: '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  $('#qr-pase-placa').textContent = placa;
  $('#qr-pase-titular').textContent = v.TitularNombre || 'Sin titular';
  $('#qr-pase-tipo').textContent = v.TipoTitular || '—';
  $('#qr-pase-vehiculo').textContent = [v.Marca, v.Modelo].filter(Boolean).join(' ') || 'No especificado';
  $('#qr-pase-color').textContent = v.Color || 'No especificado';

  const estadoEl = $('#qr-pase-estado');
  estadoEl.className = 'badge ' + (activo ? 'badge-ok' : 'badge-bad');
  estadoEl.textContent = activo ? 'Activo' : 'Baja';
  $('#qr-pase-id').textContent = [v.ID, v.FechaAlta ? 'Alta ' + fechaHoraCorta(v.FechaAlta) : ''].filter(Boolean).join(' · ');

  openModal('modal-pase-qr');
}

      '<td class="py-3 px-3 text-xs font-semibold text-navy break-all">' + escapeHtml(u.Correo) +
        (esYo ? ' <span class="badge badge-info ml-1">Tú</span>' : '') + '</td>' +
      '<td class="py-3 px-3 font-semibold text-ink">' + escapeHtml(u.Nombre) + '</td>' +
      '<td class="py-3 px-3"><span class="badge ' + rolCls + '">' + escapeHtml(u.Rol) + '</span></td>' +
      '<td class="py-3 px-3 text-xs text-ink-muted">' + escapeHtml(casetaTxt) + '</td>' +
      '<td class="py-3 px-3">' + badgeActivoHtml(u.Activo) + '</td>' +
      '<td class="py-3 px-3 mono text-[11px] text-ink-muted whitespace-nowrap">' + escapeHtml(fechas) + '</td>' +
      '<td class="py-3 px-3 text-right">' +
        '<div class="inline-flex items-center justify-end gap-1">' +
          '<button type="button" class="btn btn-neutral btn-icon !min-h-[36px] !w-9" data-usr-action="editar" data-id="' +
            escapeHtml(u.ID) + '" title="Editar usuario" aria-label="Editar a ' + escapeHtml(u.Correo) + '">' +
            '<i data-lucide="pencil" class="w-4 h-4"></i></button>' +
          '<button type="button" class="btn ' + (activo ? 'btn-danger' : 'btn-neutral') + ' btn-sm !min-h-[36px]" data-usr-action="toggle" data-id="' +
            escapeHtml(u.ID) + '" data-activo="' + (!activo) + '"' + (esYo && activo ? ' disabled title="No puede desactivar su propia cuenta"' : '') + '>' +
            '<i data-lucide="' + (activo ? 'user-x' : 'user-check') + '" class="w-4 h-4"></i>' +
            '<span>' + (activo ? 'Desactivar' : 'Activar') + '</span></button>' +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join('');
  refreshIcons();
}

function abrirModalUsuario(id) {
  if (!hasPerm('usuarios')) { showToast('No tiene permiso para gestionar usuarios.', 'warning'); return; }
  const u = id ? CAT.usuarios.find(x => String(x.ID) === String(id)) : null;

  const selCaseta = $('#usr-f-caseta');
  selCaseta.innerHTML = '<option value="">Sin caseta asignada</option>' +
    STATE.casetas.map(c => '<option value="' + escapeHtml(c.ID) + '">' + escapeHtml(c.Nombre) + '</option>').join('');

  $('#usr-f-id').value = u ? u.ID : '';
  $('#usr-f-correo').value = u ? (u.Correo || '') : '';
  $('#usr-f-nombre').value = u ? (u.Nombre || '') : '';
  $('#usr-f-rol').value = u && ROLES_VALIDOS.indexOf(u.Rol) !== -1 ? u.Rol : 'Operador de Caseta';
  const casetaMatch = u && u.CasetaAsignada ? buscarCaseta(u.CasetaAsignada) : null;
  selCaseta.value = casetaMatch ? casetaMatch.ID : '';
  $('#usr-f-activo').checked = u ? esActivo(u.Activo) : true;
  $('#modal-usuario-title').textContent = u ? 'Editar usuario' : 'Nuevo usuario';

  openModal('modal-usuario');
}

async function guardarRegistroUsuario() {
  const id = valorCampo('usr-f-id');
  const correo = valorCampo('usr-f-correo').toLowerCase();
  const nombre = valorCampo('usr-f-nombre');
  const rol = valorCampo('usr-f-rol');
  const caseta = valorCampo('usr-f-caseta');
  const activo = $('#usr-f-activo').checked;

  if (!correo || !REGEX_CORREO.test(correo)) { showToast('Capture un correo electrónico válido.', 'warning'); return; }
  const dom = correo.split('@')[1] || '';
  if (DOMINIOS_INST.indexOf(dom) === -1) {
    showToast('El correo debe pertenecer a un dominio institucional (' + DOMINIOS_INST.join(', ') + ').', 'warning');
    return;
  }
  if (!nombre) { showToast('El nombre completo es obligatorio.', 'warning'); return; }
  if (ROLES_VALIDOS.indexOf(rol) === -1) { showToast('Seleccione un rol válido.', 'warning'); return; }

  const datos = { Correo: correo, Nombre: nombre, Rol: rol, CasetaAsignada: caseta, Activo: activo };
  if (id) datos.ID = id;

  const btn = $('#btn-usr-guardar');
  try {
    const r = await withBusy(btn, 'Guardando…', () => runGas('guardarUsuario', datos));
    if (!r) return;
    closeModal('modal-usuario');
    showToast(id ? 'Usuario actualizado.' : 'Usuario registrado.', 'success');
    cargarUsuarios();
  } catch (e) {
    showToast(e.message, 'error', 7000);
  }
}

async function alternarEstadoUsuario(id, nuevoActivo, btn) {
  if (!hasPerm('usuarios') || !id) return;
  try {
    const r = await withBusy(btn, nuevoActivo ? 'Activando…' : 'Desactivando…', () =>
      runGas('cambiarEstadoUsuario', id, nuevoActivo));
    if (!r) return;
    showToast((nuevoActivo ? 'Cuenta activada: ' : 'Cuenta desactivada: ') + r.Correo, 'success');
    cargarUsuarios();
  } catch (e) {
    showToast(e.message, 'error', 7000);
  }
}

/* =====================================================================
 * Arranque
 * ===================================================================== */
function iniciarApp() {
  refreshIcons();
  bindModales();
  bindNavegacion();
  bindCasetaSelects();
  initOperacion();
  initConsultas();
  initReportes();
  initCatalogos();
  iniciarSesion();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciarApp);
else iniciarApp();
</script>
